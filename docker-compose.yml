services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      OPENRI_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      OPENRI_UPLOAD_LIMIT_BYTES: "20971520"
    ports:
      - "8008:8008"
    volumes:
      - openri-data:/root/.openri

  frontend:
    image: node:22-slim
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_OPENRI_API_BASE: http://127.0.0.1:8008
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  openri-data:
