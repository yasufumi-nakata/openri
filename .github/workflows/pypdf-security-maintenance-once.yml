name: PDF security maintenance once
on:
  push:
    branches: [automation/dependency-reconciliation-20261106]
    paths: [.github/workflows/pypdf-security-maintenance-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.15'
      - name: Verify official metadata and update exact dependency locks
        run: |
          python3 - <<'PY'
          import json
          import re
          import tomllib
          from pathlib import Path
          from urllib.request import urlopen
          version = '6.21.4'
          with urlopen(f'https://pypi.org/pypi/pypdf/{version}/json', timeout=30) as response:
              metadata = json.load(response)
          assert metadata['info']['version'] == version
          assert metadata['info']['requires_python'] == '>=3.9'
          files = [item for item in metadata['urls'] if not item['yanked']]
          assert len(files) == 2 and {f['packagetype'] for f in files} == {'sdist', 'bdist_wheel'}
          hashes = sorted(item['digests']['sha256'] for item in files)
          assert all(re.fullmatch(r'[0-9a-f]{64}', digest) for digest in hashes)
          print('Verified official release:', version, metadata['info']['requires_python'], hashes)
          before = tomllib.loads(Path('uv.lock').read_text())
          Path('/tmp/pdf-lock-before.json').write_text(json.dumps(sorted((p['name'], p['version']) for p in before['package'] if p['name'] != 'pypdf')))
          path = Path('pyproject.toml')
          text = path.read_text()
          assert text.count('pypdf>=6.16.1') == 1
          path.write_text(text.replace('pypdf>=6.16.1', f'pypdf>={version}'))
          for name in ('requirements/action.txt', 'requirements/docker.txt'):
              path = Path(name)
              text = path.read_text()
              pattern = r'(?m)^pypdf==6\.16\.1 \\\n    --hash=sha256:[0-9a-f]{64} \\\n    --hash=sha256:[0-9a-f]{64}'
              replacement = 'pypdf==' + version + ' \\\n    --hash=sha256:' + hashes[0] + ' \\\n    --hash=sha256:' + hashes[1]
              text, count = re.subn(pattern, lambda _: replacement, text)
              assert count == 1, (name, count)
              path.write_text(text.replace('pypdf>=6.16.1', f'pypdf>={version}'))
          PY
          uv lock --upgrade-package 'pypdf==6.21.4'
          uv lock --check
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          after = tomllib.loads(Path('uv.lock').read_text())
          versions = sorted([p['name'], p['version']] for p in after['package'] if p['name'] != 'pypdf')
          assert versions == json.loads(Path('/tmp/pdf-lock-before.json').read_text()), 'Unexpected unrelated Python dependency change'
          assert [p['version'] for p in after['package'] if p['name'] == 'pypdf'] == ['6.21.4']
          PY
      - name: Run full backend tests with patched PDF dependency
        run: |
          uv run --locked --python 3.12 --extra pdf --extra image --extra network --extra server --extra dev python -m pytest backend/tests -q
          git diff --check
      - name: Build and smoke-test retained container with patched hashed requirements
        run: |
          docker build --progress=plain -f Dockerfile.api -t openri-pdf-security-probe .
          docker run --rm --network none --read-only --tmpfs /root/.openri:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges --entrypoint python openri-pdf-security-probe -c 'import pypdf; assert pypdf.__version__ == "6.21.4"; from openri.api import app; print(type(app).__name__)'
          docker run --rm --network none --read-only --tmpfs /root/.openri:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges --entrypoint python openri-pdf-security-probe -m openri.cli list
      - name: Commit only verified PDF dependency files
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock requirements/action.txt requirements/docker.txt
          git commit -m 'security: upgrade pypdf to 6.21.4 and synchronize verified hashes'
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:automation/dependency-reconciliation-20261106
