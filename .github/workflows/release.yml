name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: python -m pip install -U pip && python -m pip install -e ".[pdf,network,server,dev]"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Test
        run: PYTHONPATH=backend python -m pytest backend/tests -q --cov=openri --cov-report=term-missing
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build Python distributions
        run: python -m build
      - name: Check Python distributions
        run: python -m twine check dist/*
      - name: Build checksums and SBOM
        run: python scripts/build_release_metadata.py --dist dist --out dist
      - name: Upload release build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openri-release-dist
          path: dist/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
            dist/SHA256SUMS
            dist/openri-release.spdx.json
          generate_release_notes: true
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
