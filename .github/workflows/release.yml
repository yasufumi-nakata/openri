name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_VERSION: "0.11.15"

permissions:
  contents: read

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Test
        run: uv run --locked --python 3.11 --extra pdf --extra image --extra network --extra server --extra dev python -m pytest backend/tests -q --cov=openri --cov-report=term-missing
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build Python distributions
        run: uv run --locked --python 3.11 --extra dev python -m build
      - name: Check Python distributions
        run: uv run --locked --python 3.11 --extra dev python -m twine check dist/*
      - name: Build checksums and SBOM
        run: uv run --locked --python 3.11 --extra dev python scripts/build_release_metadata.py --dist dist --out dist
      - name: Upload release build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openri-release-dist
          path: dist/*
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
