name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python package
        run: python -m pip install -U pip && python -m pip install -e ".[pdf,network,server,dev]"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Test
        run: PYTHONPATH=backend python -m pytest backend/tests -q --cov=openri --cov-report=term-missing
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build Python distributions
        run: python -m build
      - name: Check Python distributions
        run: python -m twine check dist/*
      - name: Build checksums and SBOM
        run: python scripts/build_release_metadata.py --dist dist --out dist
      - name: Upload release build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openri-release-dist
          path: dist/*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*
            dist/SHA256SUMS
            dist/openri-release.spdx.json
          generate_release_notes: true
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
