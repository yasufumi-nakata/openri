name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_VERSION: "0.11.15"

permissions:
  contents: read

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Test
        run: uv run --locked --python 3.11 --extra pdf --extra image --extra network --extra server --extra dev python -m pytest backend/tests -q --cov=openri --cov-report=term-missing
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build Python distributions
        run: uv run --locked --python 3.11 --extra dev python -m build
      - name: Check Python distributions
        run: uv run --locked --python 3.11 --extra dev python -m twine check dist/*
      - name: Build checksums and SBOM
        run: uv run --locked --python 3.11 --extra dev python scripts/build_release_metadata.py --dist dist --out dist
      - name: Upload release build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openri-release-dist
          path: dist/*
      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
