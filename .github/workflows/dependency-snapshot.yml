name: Dependency Snapshot

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build_dependency_snapshot.py"
      - ".github/workflows/dependency-snapshot.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  uv-lock:
    name: Submit uv.lock dependency snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Build dependency snapshot
        run: >
          python scripts/build_dependency_snapshot.py
          --sha "$GITHUB_SHA"
          --ref "$GITHUB_REF"
          --run-id "$GITHUB_RUN_ID"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --output dependency-snapshot.json
      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --method POST --input dependency-snapshot.json
