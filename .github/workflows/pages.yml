name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements/docker.txt"
      - "backend/**"
      - "scripts/build_pages.py"
      - "scripts/build_package_artifacts.py"
      - "scripts/validate_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_VERSION: "0.11.15"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tutorial pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build public package artifacts
        run: uv run --locked --python 3.12 --extra dev python scripts/build_package_artifacts.py
      - name: Build public pages
        run: uv run --locked --python 3.12 --extra dev python scripts/build_pages.py
      - name: Check static tutorial links
        run: uv run --locked --python 3.12 --extra dev python scripts/validate_pages.py

  deploy:
    name: Deploy tutorial site
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build public package artifacts
        run: uv run --locked --python 3.12 --extra dev python scripts/build_package_artifacts.py
      - name: Build public pages
        run: uv run --locked --python 3.12 --extra dev python scripts/build_pages.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
