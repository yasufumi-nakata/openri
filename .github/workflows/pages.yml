name: Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "packages/**"
      - "pyproject.toml"
      - "uv.lock"
      - "requirements/docker.txt"
      - "backend/**"
      - "scripts/build_pages.py"
      - "scripts/build_package_artifacts.py"
      - "scripts/validate_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_VERSION: "0.11.15"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tutorial pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build public package artifacts
        run: uv run --locked --python 3.12 --extra dev python scripts/build_package_artifacts.py
      - name: Build public pages
        run: uv run --locked --python 3.12 --extra dev python scripts/build_pages.py
      - name: Check static tutorial links
        run: uv run --locked --python 3.12 --extra dev python scripts/validate_pages.py

  deploy:
    name: Deploy tutorial site
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build public package artifacts
        run: uv run --locked --python 3.12 --extra dev python scripts/build_package_artifacts.py
      - name: Build public pages
        run: uv run --locked --python 3.12 --extra dev python scripts/build_pages.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
