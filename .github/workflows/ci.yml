name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  repository-health:
    name: Repository health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install -U pip && python -m pip install -e ".[dev]"
      - name: OSS metadata check
        run: python scripts/oss_health_check.py
      - name: Python fatal lint
        run: python -m ruff check backend/openri backend/tests scripts
      - name: Compile Python package
        run: python -m compileall -q backend/openri scripts

  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e ".[pdf,network,server,dev]"
      - name: Run tests
        run: PYTHONPATH=backend python -m pytest backend/tests -q --cov=openri --cov-report=term-missing
      - name: CLI smoke
        run: PYTHONPATH=backend python -m openri.cli check samples/high_risk_manuscript.txt --fail-on high || test $? -eq 1
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel smoke
        run: |
          python -m venv /tmp/openri-wheel-test
          . /tmp/openri-wheel-test/bin/activate
          python -m pip install -U pip
          python -m pip install dist/openri-*.whl
          openri --version
          openri check samples/high_risk_manuscript.txt --fail-on high || test $? -eq 1
      - name: Upload package artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openri-dist
          path: dist/*

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build

  frontend-e2e:
    name: Frontend E2E and accessibility smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -U pip && python -m pip install -e ".[pdf,server,dev]"
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright browser
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run browser smoke
        run: cd frontend && npm run test:e2e

  benchmark:
    name: Golden benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e ".[pdf,dev]"
      - name: Generate benchmark report
        run: PYTHONPATH=backend python scripts/benchmark_openri.py
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openri-benchmark
          path: benchmark/*
