name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -U pip && python -m pip install -e ".[pdf,network,server,dev]"
      - name: Run tests
        run: PYTHONPATH=backend python -m pytest backend/tests -q
      - name: CLI smoke
        run: PYTHONPATH=backend python -m openri.cli check samples/high_risk_manuscript.txt --fail-on high || test $? -eq 1
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel smoke
        run: |
          python -m venv /tmp/openri-wheel-test
          . /tmp/openri-wheel-test/bin/activate
          python -m pip install -U pip
          python -m pip install dist/openri-*.whl
          openri --version
          openri check samples/high_risk_manuscript.txt --fail-on high || test $? -eq 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Build frontend
        run: cd frontend && npm run build
