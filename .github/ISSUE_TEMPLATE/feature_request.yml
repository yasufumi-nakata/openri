name: Feature request
description: Request a user-facing capability, integration, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Who needs this and what review workflow does it improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - API
        - Web UI
        - GitHub Action
        - Ruleset
        - Documentation
        - Packaging
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Privacy, offline operation, external API, false-positive, or compatibility constraints.
