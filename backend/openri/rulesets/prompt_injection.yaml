id: prompt_injection
name: LLM-reviewer manipulation default ruleset
description: |
  既知のLLM査読操作・隠し指示・不可視文字の検出パターン。
  ユーザー定義の追加rulesetを OPENRI_PROMPT_INJECTION_RULES 環境変数で指定すると
  本ruleset に重ねて適用される。

patterns:
  # ---- LLM 命令 (英語) ----
  - id: ignore-previous-instructions
    type: phrase
    value: "ignore previous instructions"
    severity: high

  - id: ignore-all-previous-instructions
    type: phrase
    value: "ignore all previous instructions"
    severity: high

  - id: disregard-prior-instructions
    type: regex
    value: "disregard (all |any )?(prior|previous|earlier) instructions?"
    severity: high

  - id: do-not-report
    type: phrase
    value: "do not report"
    severity: medium

  - id: do-not-mention
    type: phrase
    value: "do not mention"
    severity: medium

  - id: system-prompt-leak
    type: phrase
    value: "system prompt"
    severity: medium

  - id: reviewer-should-accept
    type: phrase
    value: "reviewer should accept"
    severity: high

  - id: always-give-positive-review
    type: phrase
    value: "always give a positive review"
    severity: high

  - id: hidden-instruction
    type: phrase
    value: "hidden instruction"
    severity: medium

  - id: act-as-system
    type: regex
    value: "act as (a |the )?(system|assistant)( prompt)?"
    severity: medium

  # ---- LLM 命令 (日本語) ----
  - id: jp-reviewer-accept
    type: phrase
    value: "査読者は採択"
    severity: high

  - id: jp-ignore-instruction
    type: phrase
    value: "この指示を無視"
    severity: high

  - id: jp-positive-review
    type: phrase
    value: "肯定的な査読"
    severity: high

  # ---- 隠しCSS / HTML 属性 ----
  - id: css-display-none
    type: phrase
    value: "display:none"
    severity: medium

  - id: css-display-none-spaced
    type: phrase
    value: "display: none"
    severity: medium

  - id: css-opacity-zero
    type: phrase
    value: "opacity:0"
    severity: medium

  - id: css-font-size-zero
    type: phrase
    value: "font-size:0"
    severity: medium

  - id: css-color-white
    type: regex
    value: "color\\s*:\\s*(white|#fff(?:fff)?|rgb\\(\\s*255\\s*,\\s*255\\s*,\\s*255\\s*\\))"
    severity: medium

  - id: html-visibility-hidden
    type: regex
    value: "visibility\\s*:\\s*hidden"
    severity: medium

  - id: html-aria-hidden
    type: regex
    value: "aria-hidden\\s*=\\s*['\"]true['\"]"
    severity: low

  # ---- 不可視/制御文字 ----
  - id: zero-width-space
    type: codepoint
    value: "0x200b"
    severity: high

  - id: zero-width-non-joiner
    type: codepoint
    value: "0x200c"
    severity: high

  - id: zero-width-joiner
    type: codepoint
    value: "0x200d"
    severity: high

  - id: byte-order-mark
    type: codepoint
    value: "0xfeff"
    severity: medium

  - id: rtl-override
    type: codepoint
    value: "0x202e"
    severity: high

  - id: ltr-override
    type: codepoint
    value: "0x202d"
    severity: high
